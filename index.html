<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Colorida - EMEF Getúlio Vargas</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen text-gray-800">

    <!-- Cabeçalho Colorido e Alegre -->
    <header class="bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-500 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    📚 Biblioteca Getúlio Colorida
                </h1>
                <p class="text-pink-100 text-sm mt-1">EMEF Presidente Getúlio Vargas - Gravataí</p>
            </div>
            <div class="flex gap-3">
                <button onclick="abrirModalLivro()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2 rounded-xl shadow transition transform hover:scale-105">
                    ✨ Cadastrar Livro
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- Barra de Pesquisa -->
        <div class="bg-white p-4 rounded-2xl shadow-md mb-8 flex flex-col md:flex-row gap-4 border-2 border-purple-200">
            <input type="text" id="buscaInput" placeholder="Pesquisar por título, autor ou gênero..." 
                class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 text-lg">
            <button onclick="filtrarLivros()" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition">
                🔍 Buscar Livro
            </button>
        </div>

        <!-- Vitrine de Livros -->
        <h2 class="text-2xl font-bold text-purple-900 mb-6 flex items-center gap-2">
            🎨 Acervo Disponível na Escola
        </h2>
        
        <div id="listaLivros" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os livros cadastrados vão aparecer aqui dinamicamente -->
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-pink-500 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-3 bg-gray-200 rounded w-1/2 mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-1/4"></div>
            </div>
        </div>
    </main>

    <!-- Modal Simples de Reserva -->
    <div id="modalReserva" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-yellow-400">
            <h3 class="text-2xl font-bold text-purple-800 mb-4">📖 Reservar Livro</h3>
            <p id="livroSelecionadoTitulo" class="text-sm font-semibold text-gray-600 mb-4"></p>
            
            <input type="hidden" id="livroIdReserva">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo do Aluno:</label>
                    <input type="text" id="nomeAluno" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Turma (ex: 901, 802):</label>
                    <input type="text" id="turmaAluno" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail para aviso:</label>
                    <input type="email" id="emailAluno" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="fecharModalReserva()" class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">Cancelar</button>
                <button onclick="enviarReserva()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold px-5 py-2 rounded-xl shadow">Confirmar Reserva</button>
            </div>
        </div>
    </div>

    <!-- Script de Integração com a API -->
    <script>
        const API_URL = '/api/biblioteca'; // Aponta direto para a sua API na Vercel

        async function carregarLivros() {
            try {
                const res = await fetch(API_URL);
                const livros = await res.json();
                const container = document.getElementById('listaLivros');
                
                if (livros.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10 bg-white rounded-2xl shadow">Nenhum livro cadastrado ainda. Clique em "Cadastrar Livro" para começar!</p>`;
                    return;
                }

                container.innerHTML = livros.map(l => `
                    <div class="bg-white rounded-2xl shadow-md p-5 border-t-8 border-purple-500 flex flex-col justify-between hover:shadow-xl transition transform hover:-translate-y-1">
                        <div>
                            <span class="text-xs font-bold uppercase px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg">${l.genero || 'Geral'}</span>
                            <h3 class="font-bold text-lg text-purple-900 mt-2">${l.titulo}</h3>
                            <p class="text-sm text-gray-600">Autor: ${l.autor}</p>
                            <p class="text-xs text-gray-400 mt-1">Ano: ${l.ano || 'N/I'}</p>
                        </div>
                        <button onclick="abrirReserva('${l.id}', '${l.titulo}')" class="mt-4 w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold py-2 rounded-xl shadow hover:opacity-90 transition">
                            Reservar Livro 🎒
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Erro ao carregar livros:", err);
            }
        }

        function abrirReserva(id, titulo) {
            document.getElementById('livroIdRes
