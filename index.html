<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca — EMEF Presidente Getúlio Vargas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Fredoka', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 text-center sm:text-left">
        <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-sm text-3xl">📚</div>
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Biblioteca</h1>
          <p class="text-indigo-100 text-sm font-medium">EMEF Presidente Getúlio Vargas</p>
        </div>
      </div>

      <button onclick="abrirModalCadastro()" class="bg-emerald-400 hover:bg-emerald-300 active:scale-95 text-slate-900 font-bold px-5 py-3 rounded-xl shadow-md transition transform flex items-center gap-2 cursor-pointer">
        <span class="text-xl">+</span> Cadastrar Livro
      </button>
    </div>
  </header>

  <!-- Barra de Busca e Filtros -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-3">
      <input 
        type="text" 
        id="campoBusca" 
        oninput="filtrarLivros()" 
        placeholder="Buscar por título, autor ou categoria..." 
        class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700"
      />
      <select id="filtroStatus" onchange="filtrarLivros()" class="px-4 py-3 rounded-xl border border-slate-300 bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="todos">Todos os livros</option>
        <option value="disponivel">Disponíveis</option>
        <option value="emprestado">Emprestados / Reservados</option>
      </select>
    </div>

    <!-- Cabeçalho do Acervo -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Acervo Disponível na Escola</h2>
      <span id="contadorLivros" class="bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-full">Carregando...</span>
    </div>

    <!-- Grade de Livros -->
    <div id="listaLivros" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Os cards dos livros serão inseridos aqui via JavaScript -->
    </div>

    <!-- Estado Vazio -->
    <div id="estadoVazio" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
      <div class="text-5xl mb-3">📖</div>
      <h3 class="text-xl font-bold text-slate-700">Nenhum livro encontrado</h3>
      <p class="text-slate-500 mt-1">Clique em "+ Cadastrar Livro" no topo para adicionar o primeiro exemplar ao acervo.</p>
    </div>
  </main>

  <!-- Modal: Cadastrar Livro -->
  <div id="modalCadastro" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-2xl font-bold text-slate-800">Novo Livro</h3>
        <button onclick="fecharModalCadastro()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold cursor-pointer">&times;</button>
      </div>

      <form id="formCadastro" onsubmit="salvarLivro(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Título do Livro *</label>
          <input type="text" id="tituloLivro" required placeholder="Ex: O Pequeno Príncipe" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Autor(a) *</label>
          <input type="text" id="autorLivro" required placeholder="Ex: Antoine de Saint-Exupéry" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Categoria</label>
            <select id="categoriaLivro" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Literatura Infantil">Literatura Infantil</option>
              <option value="Literatura Juvenil">Literatura Juvenil</option>
              <option value="Romance / Ficção">Romance / Ficção</option>
              <option value="HQs e Mangás">HQs e Mangás</option>
              <option value="Didático / Pesquisa">Didático / Pesquisa</option>
              <option value="Artes e Cultura">Artes e Cultura</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Código / Prateleira</label>
            <input type="text" id="codigoLivro" placeholder="Ex: PRAT-04" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="fecharModalCadastro()" class="px-4 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 cursor-pointer">Cancelar</button>
          <button type="submit" id="btnSalvarLivro" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl shadow cursor-pointer">Salvar no Acervo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Reservar / Emprestar Livro -->
  <div id="modalReserva" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-2xl font-bold text-slate-800">Reservar Livro</h3>
        <button onclick="fecharModalReserva()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold cursor-pointer">&times;</button>
      </div>
      <p id="nomeLivroReserva" class="text-indigo-600 font-semibold mb-4"></p>

      <form id="formReserva" onsubmit="confirmarReserva(event)" class="space-y-4">
        <input type="hidden" id="idLivroReserva">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nome do Aluno(a) ou Professor(a) *</label>
          <input type="text" id="nomeLeitor" required placeholder="Nome completo" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Turma / Setor *</label>
          <input type="text" id="turmaLeitor" required placeholder="Ex: 7º Ano B ou Professores" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="fecharModalReserva()" class="px-4 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 cursor-pointer">Cancelar</button>
          <button type="submit" id="btnConfirmarReserva" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl shadow cursor-pointer">Confirmar Reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let acervoGlobal = [];

    // Carregar livros ao abrir a página
    document.addEventListener('DOMContentLoaded', carregarLivros);

    async function carregarLivros() {
      try {
        const res = await fetch('/api/biblioteca');
        const data = await res.json();
        acervoGlobal = Array.isArray(data) ? data : (data.livros || []);
        filtrarLivros();
      } catch (err) {
        console.error('Erro ao buscar acervo:', err);
        document.getElementById('contadorLivros').textContent = 'Erro ao carregar';
      }
    }

    function filtrarLivros() {
      const termo = document.getElementById('campoBusca').value.toLowerCase();
      const status = document.getElementById('filtroStatus').value;

      const filtrados = acervoGlobal.filter(livro => {
        const bateTexto = (livro.titulo || '').toLowerCase().includes(termo) ||
                          (livro.autor || '').toLowerCase().includes(termo) ||
                          (livro.categoria || '').toLowerCase().includes(termo);
        const disponivel = livro.disponivel !== false;
        const bateStatus = status === 'todos' ||
                           (status === 'disponivel' && disponivel) ||
                           (status === 'emprestado' && !disponivel);
        return bateTexto && bateStatus;
      });

      renderizarLivros(filtrados);
    }

    function renderizarLivros(lista) {
      const container = document.getElementById('listaLivros');
      const vazio = document.getElementById('estadoVazio');
      const contador = document.getElementById('contadorLivros');

      contador.textContent = `${lista.length} ${lista.length === 1 ? 'livro' : 'livros'}`;
      container.innerHTML = '';

      if (lista.length === 0) {
        vazio.classList.remove('hidden');
        return;
      }
      vazio.classList.add('hidden');

      lista.forEach(livro => {
        const disponivel = livro.disponivel !== false;
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700">
                ${livro.categoria || 'Geral'}
              </span>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${disponivel ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${disponivel ? '● Disponível' : '● Emprestado'}
              </span>
            </div>
            <h3 class="text-lg font-bold text-slate-800 leading-snug mb-1">${livro.titulo}</h3>
            <p class="text-sm text-slate-600 mb-2">por <span class="font-medium">${livro.autor}</span></p>
            ${livro.codigo ? `<p class="text-xs text-slate-400">Localização: ${livro.codigo}</p>` : ''}
            ${!disponivel && livro.leitor ? `<p class="mt-2 text-xs bg-amber-50 text-amber-900 p-2 rounded-lg border border-amber-200">Com: <strong>${livro.leitor}</strong> (${livro.turma || ''})</p>` : ''}
          </div>

          <div class="mt-5 pt-4 border-t border-slate-100 flex gap-2">
            ${disponivel
              ? `<button onclick="abrirModalReserva('${livro.id}', '${livro.titulo.replace(/'/g, "\\'")}')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded-xl text-sm transition cursor-pointer">Reservar</button>`
              : `<button onclick="devolverLivro('${livro.id}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-3 rounded-xl text-sm transition cursor-pointer">Registrar Devolução</button>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Controles dos Modais
    function abrirModalCadastro() {
      const m = document.getElementById('modalCadastro');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function fecharModalCadastro() {
      const m = document.getElementById('modalCadastro');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.getElementById('formCadastro').reset();
    }

    function abrirModalReserva(id, titulo) {
      document.getElementById('idLivroReserva').value = id;
      document.getElementById('nomeLivroReserva').textContent = `Livro: ${titulo}`;
      const m = document.getElementById('modalReserva');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function fecharModalReserva() {
      const m = document.getElementById('modalReserva');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.getElementById('formReserva').reset();
    }

    // Ações com a API
    async function salvarLivro(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvarLivro');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const payload = {
        acao: 'cadastrar',
        titulo: document.getElementById('tituloLivro').value.trim(),
        autor: document.getElementById('autorLivro').value.trim(),
        categoria: document.getElementById('categoriaLivro').value,
        codigo: document.getElementById('codigoLivro').value.trim()
      };

      try {
        const res = await fetch('/api/biblioteca', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Falha ao salvar');
        fecharModalCadastro();
        await carregarLivros();
      } catch (err) {
        alert('Erro ao cadastrar livro. Verifique a conexão com a API.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar no Acervo';
      }
    }

    async function confirmarReserva(e) {
      e.preventDefault();
      const btn = document.getElementById('btnConfirmarReserva');
      btn.disabled = true;
      btn.textContent = 'Reservando...';

      const payload = {
        acao: 'reservar',
        id: document.getElementById('idLivroReserva').value,
        leitor: document.getElementById('nomeLeitor').value.trim(),
        turma: document.getElementById('turmaLeitor').value.trim()
      };

      try {
        const res = await fetch('/api/biblioteca', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Falha ao reservar');
        fecharModalReserva();
        await carregarLivros();
      } catch (err) {
        alert('Erro ao registrar reserva.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirmar Reserva';
      }
    }

    async function devolverLivro(id) {
      if (!confirm('Confirmar a devolução deste livro para o acervo?')) return;
      try {
        await fetch('/api/biblioteca', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'devolver', id })
        });
        await carregarLivros();
      } catch (err) {
        alert('Erro ao registrar devolução.');
      }
    }
  </script>
</body>
</html>
